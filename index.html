window.storage = {
  async get(key, shared) { const v = localStorage.getItem((shared ? "s:" : "p:") + key); if (v == null) throw new Error("not found"); return { key, value: v, shared: !!shared }; },
  async set(key, value, shared) { localStorage.setItem((shared ? "s:" : "p:") + key, value); return { key, value, shared: !!shared }; },
  async delete(key, shared) { localStorage.removeItem((shared ? "s:" : "p:") + key); return { key, deleted: true, shared: !!shared }; },
  async list(prefix = "", shared) { const pre = (shared ? "s:" : "p:") + prefix; const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre)) keys.push(k.slice(2)); } keys.sort(); return { keys, prefix, shared: !!shared }; },
};

const PTS = { C: 10, I: 4, M: 1 };
const CRIT_LABEL = { C: "CRÍTICO", I: "IMPORTANTE", M: "MENOR" };

/* ============ EVALUACIÓN ============ */
function tempValue(c, e) { let v = parseFloat(e.value); if (isNaN(v)) return NaN; if (c.neg) v = Math.abs(v) * ((e.sign || "-") === "+" ? 1 : -1); return v; }
function evalControl(c, e) {
  if (!e) return { status: "pending", pct: 0 };
  if (c.type === "temp") {
    if (e.value === "" || e.value == null) return { status: "pending", pct: 0 };
    const v = tempValue(c, e);
    if (isNaN(v)) return { status: "pending", pct: 0 };
    return v >= c.min && v <= c.max ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "stock") {
    if (e.value === "" || e.value == null) return { status: "pending", pct: 0 };
    const v = parseFloat(e.value);
    if (isNaN(v)) return { status: "pending", pct: 0 };
    const pct = Math.min(v / c.min, 1);
    if (pct >= 1) return { status: "ok", pct: 1 };
    if (pct >= 0.7) return { status: "alerta", pct };
    return { status: "falla", pct };
  }
  if (c.type === "multicount") {
    const counts = e.counts || {};
    let worst = "ok", sum = 0;
    for (const it of c.items) {
      const raw = counts[it];
      if (raw === "" || raw == null || isNaN(parseFloat(raw))) return { status: "pending", pct: 0 };
      const pct = Math.min(parseFloat(raw) / c.minEach, 1);
      sum += pct;
      if (pct < 0.7) worst = "falla";
      else if (pct < 1 && worst !== "falla") worst = "alerta";
    }
    return { status: worst, pct: sum / c.items.length };
  }
  if (c.type === "check") {
    if (c.naOption && e.na) return { status: "ok", pct: 1 };
    if (e.ok == null) return { status: "pending", pct: 0 };
    return e.ok ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "checkfoto") {
    if (e.ok == null) return { status: "pending", pct: 0 };
    if (!e.photo) return { status: "pending", pct: 0 };
    if (c.pesoMin != null) {
      if (e.value === "" || e.value == null || isNaN(parseFloat(e.value))) return { status: "pending", pct: 0 };
      const pct = Math.min(parseFloat(e.value) / c.pesoMin, 1);
      if (e.ok === false || pct < 0.7) return { status: "falla", pct: e.ok === false ? 0 : pct };
      if (pct < 1) return { status: "alerta", pct };
      return { status: "ok", pct: 1 };
    }
    return e.ok ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "photo") {
    if (c.naOption && e.na) return { status: "ok", pct: 1 };
    return e.photo ? { status: "ok", pct: 1 } : { status: "pending", pct: 0 };
  }
  if (c.type === "muestreo") {
    const items = e.items || {};
    const keys = Object.keys(items);
    if (!keys.length || keys.some((k) => items[k] == null)) return { status: "pending", pct: 0 };
    return keys.every((k) => items[k]) ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "canales") {
    const it = e.items || {};
    let anyFail = false;
    for (const n of c.items) {
      const v = it[n];
      if (v == null) return { status: "pending", pct: 0 };
      if (v === "fail") anyFail = true;
    }
    return anyFail ? { status: "falla", pct: 0 } : { status: "ok", pct: 1 };
  }
  if (c.type === "posiciones") {
    const p = e.pos || {};
    let missing = false;
    for (const n of c.items) {
      if (p[n] == null) return { status: "pending", pct: 0 };
      if (p[n] === false) missing = true;
    }
    return missing ? { status: "falla", pct: 0 } : { status: "ok", pct: 1 };
  }
  return { status: "pending", pct: 0 };
}

/* ============ DESCRIPCIÓN DEL VALOR CAPTURADO (para CSV y reportes) ============ */
function describeValor(c, e) {
  if (!e) return "";
  if (c.type === "temp") { if (e.value === "" || e.value == null) return ""; const v = tempValue(c, e); return isNaN(v) ? "" : `${v} ${c.unit}`; }
  if (c.type === "stock") return e.value != null && e.value !== "" ? `${e.value} ${c.unit} (mín ${c.min})` : "";
  if (c.type === "multicount") { const cts = e.counts || {}; return c.items.map((i) => `${i}: ${cts[i] ?? "—"}`).join(" · "); }
  if (c.type === "check") { if (c.naOption && e.na) return "No aplica"; return e.ok == null ? "" : (e.ok ? (c.okText || "Conforme") : (c.failText || "No conforme")); }
  if (c.type === "checkfoto") {
    let s = e.ok == null ? "" : (e.ok ? (c.okText || "Conforme") : (c.failText || "No conforme"));
    if (c.pesoMin != null && e.value != null && e.value !== "") s += ` · ${e.value} kg (mín ${c.pesoMin})`;
    if (e.photo) s += " + foto";
    return s;
  }
  if (c.type === "photo") return c.naOption && e.na ? "No aplica" : (e.photo ? "Foto capturada" : "");
  if (c.type === "muestreo") { const it = e.items || {}; return Object.keys(it).map((k) => `${k}: ${it[k] == null ? "—" : it[k] ? "OK" : "NO"}`).join(" · "); }
  if (c.type === "canales") { const it = e.items || {}; return c.items.map((k) => `${k}: ${it[k] == null ? "—" : it[k] === "ok" ? "En línea" : it[k] === "fail" ? "Caído" : "N/A"}`).join(" · "); }
  if (c.type === "posiciones") { const p = e.pos || {}; let s = c.items.map((k) => `${k}: ${p[k] == null ? "—" : p[k] ? "Presente" : "Ausente"}`).join(" · "); if (e.extra) s += ` · Extra: ${e.extra}`; return s; }
  return "";
}

/* ============ SEMÁFORO GLOBAL ============ */
function evalGlobal(entries) {
  let pts = 0, ptsMax = 0, criticalOpen = [], impFail = 0, minorFail = 0, pendingCrit = 0, pendingTotal = 0;
  const incidencias = [];
  const pendientes = [];
  for (const c of CONTROLS) {
    const r = evalControl(c, entries[c.id]);
    const w = PTS[c.crit];
    ptsMax += w;
    if (r.status === "ok") pts += w;
    else if (r.status === "alerta") pts += w * r.pct;
    if (r.status === "pending") { pendingTotal++; pendientes.push(c); if (c.crit === "C") pendingCrit++; }
    if (r.status === "falla") {
      incidencias.push({ c, r });
      if (c.crit === "C") criticalOpen.push(c);
      else if (c.crit === "I") impFail++;
      else minorFail++;
    }
    if (r.status === "alerta") incidencias.push({ c, r, alerta: true });
  }
  const score = Math.round((pts / ptsMax) * 100);
  let estado, razon;
  if (criticalOpen.length > 0) { estado = "rojo"; razon = `${criticalOpen.length} control(es) crítico(s) fallando`; }
  else if (pendingTotal > 0) { estado = "proceso"; razon = `Faltan ${pendingTotal} controles por capturar${pendingCrit > 0 ? ` (${pendingCrit} críticos)` : ""}`; }
  else if (score < 75) { estado = "rojo"; razon = `Score ${score} < 75`; }
  else if (score < 90 || impFail >= 2) { estado = "amarillo"; razon = impFail >= 2 ? `${impFail} importantes fallando` : `Score ${score} (75–89)`; }
  else { estado = "verde"; razon = impFail === 1 ? "1 importante abierto con incidencia" : "Todos los controles al estándar"; }
  return { estado, razon, score, incidencias, pendientes, pendingTotal, pendingCrit, criticalOpen, impFail, minorFail };
}

/* ============ RUTEO DE NOTIFICACIONES (simulado en piloto) ============ */
function notifyTarget(c) {
  if (c.type === "posiciones") return "Recursos Humanos + Gerente distrital";
  if (c.type === "temp") return "Mantenimiento + Gerente de turno";
  if (c.type === "canales" || c.id === 25 || c.id === 27) return "Soporte de sistemas (Foodbot)";
  if (c.type === "stock" || c.type === "multicount") return "Jefe de producción + Gerente distrital";
  return "Gerente de turno";
}

/* ============ HISTORIAL, RESUMEN Y CSV ============ */
function sanitizeKey(s) { return (s || "sucursal").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sucursal"; }

function buildResumen(meta, today, g, entries, captured, total) {
  const icon = { verde: "🟢", amarillo: "🟡", rojo: "🔴", proceso: "⚪" }[g.estado];
  const estado = { verde: "LISTO PARA ABRIR", amarillo: "APERTURA CON OBSERVACIONES", rojo: "NO LISTO PARA ABRIR", proceso: "CAPTURA EN PROCESO" }[g.estado];
  const momento = meta.firma ? new Date(meta.firma.ts) : new Date();
  const tardio = meta.sucursal && esTardio(meta.sucursal, momento);
  let txt = "";
  if (!meta.firma) txt += "⏳ REPORTE PRELIMINAR — apertura aún NO liberada\n";
  if (meta.firma && meta.firma.forzada) txt += `⚠️ APERTURA FIRMADA CON EXCEPCIONES (no conforme)\nJustificación: ${meta.firma.justificacion || "—"}\n`;
  if (tardio) txt += `⏰ REPORTE TARDÍO — límite de esta sucursal: ${limiteDe(meta.sucursal)}\n`;
  txt += `🏮 LINE CHECK · ${meta.sucursal || "Sucursal"} · ${today}\n${icon} ${estado} · Score ${g.score} · ${captured}/${total} capturados\n`;
  txt += `Responsable: ${meta.responsable || "—"}${meta.puesto ? ` (${meta.puesto})` : ""}\n`;
  if (meta.firma) txt += `✍ Liberado a las ${momento.toLocaleTimeString()}\n`;
  const pend = CONTROLS.filter((c) => evalControl(c, entries[c.id]).status === "pending");
  if (g.incidencias.length) {
    txt += `\nIncidencias (${g.incidencias.length}):\n`;
    for (const { c, r, alerta } of g.incidencias) {
      txt += `• ${c.name} [${CRIT_LABEL[c.crit]}${alerta ? ` · ${Math.round(r.pct * 100)}% del mínimo` : ""}]\n  Acción: ${entries[c.id]?.comment || "pendiente de registrar"}\n  Notificar: ${notifyTarget(c)}\n`;
    }
  }
  if (pend.length) {
    txt += `\n⏳ Pendientes de captura (${pend.length}):\n` + pend.map((c) => `• ${c.name}${c.crit === "C" ? " [CRÍTICO]" : ""}`).join("\n") + "\n";
  }
  if (!g.incidencias.length && !pend.length) txt += "\nSin incidencias. Todos los controles al estándar. ✅\n";
  return txt;
}

function exportCSV(records) {
  const rows = [["Fecha", "Sucursal", "Responsable", "Puesto", "Estado", "Score", "Reporte tardío", "Con excepciones", "Justificación", "Bloque", "Control", "Criticidad", "Valor capturado", "Status", "Comentario / acción", "Notificar a", "Hora de captura"]];
  const push = (rec) => {
    if ((rec.respuestas || []).length) {
      rec.respuestas.forEach((r) => rows.push([rec.fecha, rec.sucursal, rec.responsable || (rec.firma && rec.firma.nombre) || "", rec.puesto || "", rec.estado, rec.score, rec.tardio ? "SÍ" : "No", rec.forzada ? "SÍ" : "No", rec.justificacion || "", r.block, r.name, CRIT_LABEL[r.crit] || r.crit, r.valor, r.status, r.comment || "", r.notifica || "", r.hora || ""]));
    } else {
      (rec.incidencias || []).forEach((inc) => rows.push([rec.fecha, rec.sucursal, (rec.firma && rec.firma.nombre) || "", rec.puesto || "", rec.estado, rec.score, rec.tardio ? "SÍ" : "No", rec.forzada ? "SÍ" : "No", rec.justificacion || "", "", inc.name, CRIT_LABEL[inc.crit] || inc.crit, "", inc.alerta ? "alerta" : "falla", inc.comment || "", inc.notifica || "", ""]));
    }
  };
  records.forEach(push);
  const csv = "\uFEFF" + rows.map((r) => r.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `linecheck_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============ FOTO: comprimir a miniatura ============ */
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 480 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.6));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function LineCheckApp() {
  const today = new Date().toISOString().slice(0, 10);
  const storageKey = `linecheck:${today}`;
  const [entries, setEntries] = useState({});
  const [meta, setMeta] = useState({ sucursal: "", responsable: "", puesto: "", firma: null });
  const [tab, setTab] = useState("linea");
  const [loaded, setLoaded] = useState(false);
  const [hist, setHist] = useState(null);
  const [copied, setCopied] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const [reloj, setReloj] = useState(new Date());

  useEffect(() => { const t = setInterval(() => setReloj(new Date()), 30000); return () => clearInterval(t); }, []);

  const assignedItems = useMemo(() => {
    const rng = mulberry32(hashStr(today));
    const sensorial = [
      "Salsa: " + pickN(POOL_SALSAS, 1, rng)[0],
      "Aderezo: " + pickN(POOL_ADEREZOS, 1, rng)[0],
      "Bebida: " + pickN(POOL_CONCENTRADOS, 1, rng)[0],
      ...pickN(POOL_VEGETALES, 3, rng).map((v) => "Vegetal: " + v),
      ...PROTEINAS.map((p) => "Proteína: " + p),
    ];
    return { sensorial, proteina: pickN(PROTEINAS, 1, rng) };
  }, [today]);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(storageKey);
        if (res?.value) { const d = JSON.parse(res.value); setEntries(d.entries || {}); setMeta({ sucursal: "", responsable: "", puesto: "", firma: null, ...(d.meta || {}) }); }
      } catch { /* primer uso del día */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(storageKey, JSON.stringify({ entries, meta })); } catch (err) { console.error("No se pudo guardar", err); }
    }, 600);
    return () => clearTimeout(t);
  }, [entries, meta, loaded]);

  const update = (id, val) => setEntries((prev) => ({ ...prev, [id]: val }));
  const g = evalGlobal(entries);
  const sem = SEM[g.estado];

  const captured = CONTROLS.filter((c) => evalControl(c, entries[c.id]).status !== "pending").length;
  const commentsMissing = g.incidencias.some(({ c }) => !(entries[c.id]?.comment));
  const canSign = g.estado !== "rojo" && g.pendingTotal === 0 && !commentsMissing && meta.responsable.trim() && meta.sucursal && meta.puesto;
  const tardioAhora = meta.sucursal && esTardio(meta.sucursal, meta.firma ? new Date(meta.firma.ts) : reloj);

  const buildRespuestas = () => CONTROLS.map((c) => {
    const e = entries[c.id];
    const r = evalControl(c, e);
    return {
      name: c.name, block: c.block, crit: c.crit,
      valor: describeValor(c, e || {}),
      status: r.status === "alerta" ? `alerta ${Math.round(r.pct * 100)}%` : r.status,
      comment: e?.comment || "",
      notifica: (r.status === "falla" || r.status === "alerta") ? notifyTarget(c) : "",
      hora: e?.ts ? new Date(e.ts).toLocaleTimeString() : "",
    };
  });

  const firmarLiberacion = async (forzada = false, justificacion = "") => {
    const ahora = new Date();
    const firma = { nombre: meta.responsable, ts: ahora.toISOString(), forzada, justificacion };
    const tardio = meta.sucursal ? esTardio(meta.sucursal, ahora) : false;
    setMeta({ ...meta, firma });
    const record = {
      sucursal: meta.sucursal || "Sucursal", fecha: today, firma, responsable: meta.responsable, puesto: meta.puesto,
      estado: g.estado, score: g.score, tardio, limite: limiteDe(meta.sucursal),
      forzada, justificacion,
      pendientes: g.pendientes.map((c) => c.name),
      respuestas: buildRespuestas(),
      incidencias: g.incidencias.map(({ c, r, alerta }) => ({ name: c.name, crit: c.crit, alerta: !!alerta, pct: Math.round(r.pct * 100), comment: entries[c.id]?.comment || "", notifica: notifyTarget(c) })),
      fotos: CONTROLS.filter((c) => entries[c.id]?.photo).map((c) => ({ name: c.name, photo: entries[c.id].photo, ts: entries[c.id].ts })),
      resumen: buildResumen({ ...meta, firma }, today, g, entries, captured, CONTROLS.length),
    };
    try {
      const key = `historial:${sanitizeKey(meta.sucursal)}:${today}`;
      await window.storage.set(key, JSON.stringify(record), true);
      const res = await window.storage.list("historial:", true);
      const keys = (res?.keys || []).sort();
      while (keys.length > 15) { const old = keys.shift(); try { await window.storage.delete(old, true); } catch {} }
    } catch (err) { console.error("No se pudo guardar en historial", err); }
    if (SYNC_URL) {
      try { fetch(SYNC_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ ...record, fotos: (record.fotos || []).length }) }); } catch {}
    }
  };

  const firmarConExcepciones = async () => {
    const j = window.prompt("⚠️ Vas a firmar la apertura SIN estar conforme el Line Check.\n\nJustificación OBLIGATORIA (por qué se abre así y qué queda pendiente):");
    if (!j || !j.trim()) return;
    await firmarLiberacion(true, j.trim());
  };

  const copiarResumen = async () => {
    const txt = buildResumen(meta, today, g, entries, captured, CONTROLS.length);
    try { await navigator.clipboard.writeText(txt); setCopied(true); setTimeout(() => setCopied(false), 2500); }
    catch { window.prompt("Copia el resumen:", txt); }
  };

  const descargarCSV = () => {
    const records = [...(hist || [])];
    if (!meta.firma && captured > 0) {
      records.unshift({ fecha: today, sucursal: meta.sucursal || "Sucursal", responsable: meta.responsable, puesto: meta.puesto, estado: `${g.estado} (en proceso)`, score: g.score, tardio: tardioAhora, respuestas: buildRespuestas() });
    }
    if (!records.length) { alert("Aún no hay datos para exportar."); return; }
    exportCSV(records);
  };

  const loadHist = async () => {
    try {
      const res = await window.storage.list("historial:", true);
      const keys = (res?.keys || []).slice(-10).reverse();
      const out = [];
      for (const k of keys) {
        try { const r = await window.storage.get(typeof k === "string" ? k : k.key, true); if (r?.value) out.push(JSON.parse(r.value)); } catch {}
      }
      out.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
      setHist(out);
    } catch { setHist([]); }
  };
  useEffect(() => { if (tab === "historial") { setHist(null); loadHist(); } }, [tab]);

  const modControls = (mod) => {
    const blocks = [...new Set(CONTROLS.filter((c) => c.mod === mod).map((c) => c.block))];
    return blocks.map((b) => (
      <div key={b}>
        <p className="uppercase font-bold text-stone-400 mt-4 mb-2" style={{ fontSize: 11, letterSpacing: "0.14em" }}>{b}</p>
        {CONTROLS.filter((c) => c.mod === mod && c.block === b).map((c) => (
          <ControlCard key={c.id} c={c} entry={entries[c.id]} update={update} assignedItems={assignedItems} />
        ))}
      </div>
    ));
  };

  return (
    <div className="min-h-screen bg-stone-100 pb-32" style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div className="bg-stone-950 text-white px-4 pt-5 pb-4">
        <div className="flex items-baseline justify-between">
          <h1 className="font-black tracking-tight" style={{ fontSize: 22 }}>ROCK N&rsquo;WOK</h1>
          <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }} className="text-orange-400">{today}</span>
        </div>
        <p className="uppercase text-stone-400 mt-0.5" style={{ fontSize: 11, letterSpacing: "0.2em" }}>Line Check · Validación de apertura · v1.5</p>
        <div className="mt-3">
          <select value={meta.sucursal} onChange={(e) => setMeta({ ...meta, sucursal: e.target.value })}
            className={`w-full bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 ${meta.sucursal ? "text-white" : "text-stone-500"}`} style={{ fontSize: 14 }}>
            <option value="">Selecciona la sucursal…</option>
            {SUCURSALES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div className="flex gap-2 mt-2">
          <input value={meta.responsable} onChange={(e) => setMeta({ ...meta, responsable: e.target.value })} placeholder="Nombre del responsable" className="flex-1 bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-white placeholder-stone-500" style={{ fontSize: 13 }} />
          <select value={meta.puesto} onChange={(e) => setMeta({ ...meta, puesto: e.target.value })}
            className={`w-32 bg-stone-800 border border-stone-700 rounded-lg px-2 py-2 ${meta.puesto ? "text-white" : "text-stone-500"}`} style={{ fontSize: 13 }}>
            <option value="">Puesto…</option>
            {PUESTOS.map((p) => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        {meta.sucursal && !meta.firma && tardioAhora && (
          <p className="mt-2 bg-amber-500 text-black font-bold rounded-lg px-3 py-1.5" style={{ fontSize: 12 }}>⏰ Reporte tardío — el límite de {meta.sucursal} es {limiteDe(meta.sucursal)}</p>
        )}
      </div>

      <div className="flex bg-white border-b border-stone-200 sticky top-0 z-10">
        {[["linea", "Línea"], ["front", "Front"], ["resumen", "Liberación"], ["historial", "Historial"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} className={`flex-1 py-3 font-bold ${tab === k ? "text-orange-600 border-b-2 border-orange-600" : "text-stone-500"}`} style={{ fontSize: 13 }}>{label}</button>
        ))}
      </div>

      <div className="px-3 max-w-lg mx-auto">
        {tab === "linea" && modControls("linea")}
        {tab === "front" && modControls("front")}

        {tab === "historial" && (
          <div className="mt-4">
            <p className="text-stone-500 bg-white rounded-xl p-3 border border-stone-200 mb-3" style={{ fontSize: 12 }}>
              Antecedente de aperturas firmadas en este dispositivo (versión piloto — en producción vive en la base de datos central).
            </p>
            <button onClick={descargarCSV} className="w-full py-2.5 mb-3 rounded-xl font-bold bg-stone-950 text-white" style={{ fontSize: 14 }}>
              ⬇ Descargar historial en CSV (Excel)
            </button>
            {hist === null && <p className="text-stone-400 text-center py-6" style={{ fontSize: 13 }}>Cargando historial…</p>}
            {hist !== null && hist.length === 0 && <p className="text-stone-400 text-center py-6" style={{ fontSize: 13 }}>Aún no hay aperturas firmadas. La primera liberación creará el primer expediente.</p>}
            {hist !== null && hist.map((h, i) => {
              const s = SEM[h.estado] || SEM.rojo;
              const open = expanded === i;
              return (
                <div key={i} className="bg-white rounded-xl border border-stone-200 mb-2 overflow-hidden">
                  <button onClick={() => setExpanded(open ? null : i)} className="w-full text-left p-3">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <p className="font-bold text-stone-900" style={{ fontSize: 14 }}>{h.sucursal}{h.tardio ? " ⏰" : ""}{h.forzada ? " ⚠️" : ""}</p>
                        <p className="text-stone-500" style={{ fontFamily: "ui-monospace, monospace", fontSize: 11 }}>{h.fecha} · {h.firma?.nombre}{h.puesto ? ` (${h.puesto})` : ""} · {h.firma ? new Date(h.firma.ts).toLocaleTimeString() : ""}{h.tardio ? " · TARDÍO" : ""}{h.forzada ? " · CON EXCEPCIONES" : ""}</p>
                      </div>
                      <div className="text-right">
                        <span className={`${s.bg} text-white font-bold px-2 py-1 rounded`} style={{ fontSize: 11 }}>{s.icon} {h.score}</span>
                        <p className="text-stone-400 mt-1" style={{ fontSize: 11 }}>{(h.incidencias || []).length} incidencia(s) · {(h.fotos || []).length} foto(s)</p>
                      </div>
                    </div>
                  </button>
                  {open && (
                    <div className="px-3 pb-3 border-t border-stone-100">
                      {h.forzada && (
                        <p className="text-stone-700 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2 mt-2" style={{ fontSize: 12 }}>
                          <span className="font-bold">⚠️ Apertura con excepciones.</span> Justificación: {h.justificacion || "—"}
                          {(h.pendientes || []).length > 0 && <span> · Sin capturar: {h.pendientes.join(", ")}</span>}
                        </p>
                      )}
                      {(h.incidencias || []).map((inc, j) => (
                        <div key={j} className="mt-2">
                          <p className="font-semibold text-stone-800" style={{ fontSize: 13 }}>{inc.name} <span className={`ml-1 px-1.5 py-0.5 rounded font-bold ${CRIT_STYLE[inc.crit]}`} style={{ fontSize: 10 }}>{CRIT_LABEL[inc.crit]}</span></p>
                          <p className="text-stone-600" style={{ fontSize: 12 }}>{inc.alerta ? `Alerta · ${inc.pct}% del mínimo` : "Falla"} · {inc.comment || "sin acción registrada"} · 🔔 {inc.notifica}</p>
                        </div>
                      ))}
                      {(h.incidencias || []).length === 0 && <p className="text-emerald-700 font-medium mt-2" style={{ fontSize: 12 }}>Sin incidencias — apertura limpia.</p>}
                      {(h.fotos || []).length > 0 && (
                        <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
                          {h.fotos.map((f, j) => (
                            <div key={j} className="shrink-0">
                              <img src={f.photo} alt={f.name} className="w-24 h-24 object-cover rounded-lg border border-stone-200" />
                              <p className="text-stone-400 w-24 truncate" style={{ fontSize: 10 }}>{f.name}</p>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab === "resumen" && (
          <div className="mt-4">
            <div className={`${sem.bg} text-white rounded-2xl p-5 text-center`}>
              <p className="font-black" style={{ fontSize: 26 }}>{sem.icon} {sem.text}</p>
              <p className="opacity-90 mt-1" style={{ fontSize: 13 }}>{g.razon}</p>
              <div className="flex justify-center gap-6 mt-3" style={{ fontFamily: "ui-monospace, monospace", fontSize: 13 }}>
                <span>Score {g.score}</span>
                <span>{captured}/{CONTROLS.length} capturados</span>
              </div>
            </div>

            {tardioAhora && (
              <div className="bg-amber-500 text-black font-bold rounded-xl p-3 mt-3 text-center" style={{ fontSize: 13 }}>
                ⏰ REPORTE TARDÍO — límite de {meta.sucursal}: {limiteDe(meta.sucursal)}
              </div>
            )}

            {!meta.firma && (
              <button onClick={copiarResumen} className="w-full mt-3 py-2.5 rounded-xl font-bold bg-stone-950 text-white" style={{ fontSize: 14 }}>
                {copied ? "✓ Copiado — pégalo en el grupo" : "📲 Copiar reporte para WhatsApp (incluye pendientes y observaciones)"}
              </button>
            )}

            {g.criticalOpen.length > 0 && (
              <div className="bg-white border border-red-300 rounded-xl p-3 mt-3">
                <p className="font-bold text-red-700" style={{ fontSize: 13 }}>Gates críticos abiertos — bloquean la apertura:</p>
                {g.criticalOpen.map((c) => <p key={c.id} className="text-stone-800 mt-1" style={{ fontSize: 13 }}>■ {c.name}</p>)}
              </div>
            )}
            {g.pendientes.length > 0 && (
              <div className="bg-white border border-stone-300 rounded-xl p-3 mt-3">
                <p className="font-bold text-stone-700" style={{ fontSize: 13 }}>⏳ Pendientes de captura ({g.pendientes.length}):</p>
                {g.pendientes.map((c) => (
                  <p key={c.id} className="text-stone-700 mt-1" style={{ fontSize: 13 }}>
                    • {c.name} {c.crit === "C" && <span className="font-bold text-red-600">[CRÍTICO]</span>}
                  </p>
                ))}
              </div>
            )}

            <p className="uppercase font-bold text-stone-400 mt-5 mb-2" style={{ fontSize: 11, letterSpacing: "0.14em" }}>Incidencias generadas ({g.incidencias.length})</p>
            {g.incidencias.length === 0 && <p className="text-stone-500 bg-white rounded-xl p-3 border border-stone-200" style={{ fontSize: 13 }}>Sin incidencias. Todos los controles capturados están al estándar.</p>}
            {g.incidencias.map(({ c, r, alerta }) => (
              <div key={c.id + (alerta ? "a" : "f")} className="bg-white rounded-xl border border-stone-200 p-3 mb-2">
                <div className="flex items-center justify-between gap-2">
                  <p className="font-semibold text-stone-900" style={{ fontSize: 13 }}>{c.name}</p>
                  <Badge crit={c.crit} />
                </div>
                <p className={`font-bold mt-0.5 ${alerta ? "text-amber-600" : "text-red-600"}`} style={{ fontSize: 12 }}>
                  {alerta ? `ALERTA · ${Math.round(r.pct * 100)}% del mínimo` : "FALLA"}
                  {c.crit === "C" && !alerta ? " · Hora límite: antes de apertura" : c.crit === "I" ? " · Hora límite: ≤ 2 hrs" : ""}
                </p>
                <p className="text-stone-600 mt-1" style={{ fontSize: 12 }}>{entries[c.id]?.comment || "⚠ Falta registrar acción correctiva"}</p>
                <p className="text-orange-700 font-medium mt-1" style={{ fontSize: 12 }}>🔔 Notifica a: {notifyTarget(c)} <span className="text-stone-400">(automático en producción · manual en piloto)</span></p>
              </div>
            ))}

            <div className="bg-white rounded-xl border border-stone-200 p-4 mt-5">
              {meta.firma ? (
                <div className="text-center">
                  <p className={`font-black ${meta.firma.forzada ? "text-amber-600" : "text-emerald-700"}`} style={{ fontSize: 15 }}>
                    {meta.firma.forzada ? "⚠️ APERTURA FIRMADA CON EXCEPCIONES" : "APERTURA LIBERADA"}{tardioAhora ? " · ⏰ TARDÍA" : ""}
                  </p>
                  <p style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }} className="text-stone-500 mt-1">{meta.firma.nombre}{meta.puesto ? ` (${meta.puesto})` : ""} · {new Date(meta.firma.ts).toLocaleString()}</p>
                  {meta.firma.forzada && meta.firma.justificacion && (
                    <p className="text-stone-600 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mt-2 text-left" style={{ fontSize: 12 }}>
                      <span className="font-bold">Justificación:</span> {meta.firma.justificacion}
                    </p>
                  )}
                  <button onClick={copiarResumen} className={`w-full mt-3 py-2.5 rounded-xl font-bold text-white ${meta.firma.forzada ? "bg-amber-600" : "bg-emerald-600"}`} style={{ fontSize: 14 }}>
                    {copied ? "✓ Copiado — pégalo en el grupo" : "📲 Copiar resumen para WhatsApp"}
                  </button>
                  <p className="text-stone-400 mt-2" style={{ fontSize: 11 }}>Guardado en el historial y enviado a la hoja central.</p>
                </div>
              ) : (
                <React.Fragment>
                  <button disabled={!canSign} onClick={() => firmarLiberacion()}
                    className={`w-full py-3 rounded-xl font-black ${canSign ? "bg-stone-950 text-white" : "bg-stone-200 text-stone-400"}`} style={{ fontSize: 15 }}>
                    Firmar liberación de apertura
                  </button>
                  {!canSign && (
                    <p className="text-stone-500 text-center mt-2" style={{ fontSize: 12 }}>
                      {!meta.sucursal || !meta.puesto || !meta.responsable.trim() ? "Completa sucursal, responsable y puesto en el encabezado." : g.pendingTotal > 0 ? `Faltan ${g.pendingTotal} controles por capturar (lista arriba).` : g.estado === "rojo" ? "Hay críticos fallando. Corrige, o firma con excepciones dejando antecedente." : commentsMissing ? "Hay incidencias sin acción registrada." : ""}
                    </p>
                  )}
                  {!canSign && meta.sucursal && meta.puesto && meta.responsable.trim() && !commentsMissing && (
                    <React.Fragment>
                      <button onClick={firmarConExcepciones} className="w-full mt-3 py-2.5 rounded-xl font-bold border-2 border-red-500 text-red-600 bg-white" style={{ fontSize: 13 }}>
                        ⚠️ Firmar con excepciones (apertura no conforme)
                      </button>
                      <p className="text-stone-400 text-center mt-1.5" style={{ fontSize: 11 }}>Para cuando no se pudo corregir antes de abrir: exige justificación y queda como antecedente de que ese día hubo errores — visible en historial, WhatsApp y hoja central.</p>
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}
            </div>

            <button onClick={() => { setEntries({}); setMeta({ ...meta, firma: null }); }} className="w-full text-stone-400 underline mt-4 mb-2" style={{ fontSize: 12 }}>Reiniciar Line Check del día</button>
          </div>
        )}
      </div>

      {tab !== "resumen" && tab !== "historial" && (
        <div className={`fixed bottom-0 left-0 right-0 ${sem.bg} text-white px-4 py-3 flex items-center justify-between shadow-lg`}>
          <div>
            <p className="font-black leading-tight" style={{ fontSize: 14 }}>{sem.icon} {sem.text}{tardioAhora ? " · ⏰" : ""}</p>
            <p className="opacity-90" style={{ fontSize: 11 }}>{g.razon}</p>
          </div>
          <div className="text-right" style={{ fontFamily: "ui-monospace, monospace" }}>
            <p className="font-bold" style={{ fontSize: 16 }}>{g.score}</p>
            <p style={{ fontSize: 11 }} className="opacity-90">{captured}/{CONTROLS.length}</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LineCheckApp />);
</script>
</body>
</html>
