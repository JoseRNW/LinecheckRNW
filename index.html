window.storage = {
  async get(key, shared) { const v = localStorage.getItem((shared ? "s:" : "p:") + key); if (v == null) throw new Error("not found"); return { key, value: v, shared: !!shared }; },
  async set(key, value, shared) { localStorage.setItem((shared ? "s:" : "p:") + key, value); return { key, value, shared: !!shared }; },
  async delete(key, shared) { localStorage.removeItem((shared ? "s:" : "p:") + key); return { key, deleted: true, shared: !!shared }; },
  async list(prefix = "", shared) { const pre = (shared ? "s:" : "p:") + prefix; const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre)) keys.push(k.slice(2)); } keys.sort(); return { keys, prefix, shared: !!shared }; },
};
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }

function hashStr(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ============ EVALUACIÓN ============ */
function evalControl(c, e) {
  if (!e) return { status: "pending", pct: 0 };
  if (c.type === "temp") {
    if (e.value === "" || e.value == null) return { status: "pending", pct: 0 };
    const v = parseFloat(e.value);
    if (isNaN(v)) return { status: "pending", pct: 0 };
    return v >= c.min && v <= c.max ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "stock") {
    if (e.value === "" || e.value == null) return { status: "pending", pct: 0 };
    const v = parseFloat(e.value);
    if (isNaN(v)) return { status: "pending", pct: 0 };
    const pct = Math.min(v / c.min, 1);
    if (pct >= 1) return { status: "ok", pct: 1 };
    if (pct >= 0.7) return { status: "alerta", pct };
    return { status: "falla", pct };
  }
  if (c.type === "multicount") {
    const counts = e.counts || {};
    let worst = "ok", sum = 0;
    for (const it of c.items) {
      const raw = counts[it];
      if (raw === "" || raw == null || isNaN(parseFloat(raw))) return { status: "pending", pct: 0 };
      const pct = Math.min(parseFloat(raw) / c.minEach, 1);
      sum += pct;
      if (pct < 0.7) worst = "falla";
      else if (pct < 1 && worst !== "falla") worst = "alerta";
    }
    return { status: worst, pct: sum / c.items.length };
  }
  if (c.type === "check") {
    if (e.ok == null) return { status: "pending", pct: 0 };
    return e.ok ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "checkfoto") {
    if (e.ok === false) return { status: "falla", pct: 0 };
    if (e.ok === true && e.photo) return { status: "ok", pct: 1 };
    return { status: "pending", pct: 0 };
  }
  if (c.type === "photo") {
    if (c.naOption && e.na) return { status: "ok", pct: 1 };
    return e.photo ? { status: "ok", pct: 1 } : { status: "pending", pct: 0 };
  }
  if (c.type === "muestreo") {
    const items = e.items || {};
    const keys = Object.keys(items);
    if (!keys.length || keys.some((k) => items[k] == null)) return { status: "pending", pct: 0 };
    return keys.every((k) => items[k]) ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  if (c.type === "canales") {
    const it = e.items || {};
    let anyFail = false;
    for (const n of c.items) {
      const v = it[n];
      if (v == null) return { status: "pending", pct: 0 };
      if (v === "fail") anyFail = true;
    }
    return anyFail ? { status: "falla", pct: 0 } : { status: "ok", pct: 1 };
  }
  if (c.type === "posiciones") {
    const p = e.pos || {};
    let missing = false;
    for (const n of c.items) {
      if (p[n] == null) return { status: "pending", pct: 0 };
      if (p[n] === false) missing = true;
    }
    return missing ? { status: "falla", pct: 0 } : { status: "ok", pct: 1 };
  }
  if (c.type === "pos") {
    if (e.ok == null || e.value === "" || e.value == null) return { status: "pending", pct: 0 };
    return e.ok && parseFloat(e.value) > 0 ? { status: "ok", pct: 1 } : { status: "falla", pct: 0 };
  }
  return { status: "pending", pct: 0 };
}

/* ============ SEMÁFORO GLOBAL ============ */
function evalGlobal(entries) {
  let pts = 0, ptsMax = 0, criticalOpen = [], impFail = 0, minorFail = 0, pendingCrit = 0, pendingTotal = 0;
  const incidencias = [];
  for (const c of CONTROLS) {
    const r = evalControl(c, entries[c.id]);
    const w = PTS[c.crit];
    ptsMax += w;
    if (r.status === "ok") pts += w;
    else if (r.status === "alerta") pts += w * r.pct;
    if (r.status === "pending") { pendingTotal++; if (c.crit === "C") pendingCrit++; }
    if (r.status === "falla") {
      incidencias.push({ c, r });
      if (c.crit === "C") criticalOpen.push(c);
      else if (c.crit === "I") impFail++;
      else minorFail++;
    }
    if (r.status === "alerta") incidencias.push({ c, r, alerta: true });
  }
  const score = Math.round((pts / ptsMax) * 100);
  let estado, razon;
  if (criticalOpen.length > 0) { estado = "rojo"; razon = `${criticalOpen.length} control(es) crítico(s) fallando`; }
  else if (pendingCrit > 0) { estado = "rojo"; razon = `${pendingCrit} control(es) crítico(s) sin capturar`; }
  else if (score < 75) { estado = "rojo"; razon = `Score ${score} < 75`; }
  else if (score < 90 || impFail >= 2) { estado = "amarillo"; razon = impFail >= 2 ? `${impFail} importantes fallando` : `Score ${score} (75–89)`; }
  else { estado = "verde"; razon = impFail === 1 ? "1 importante abierto con incidencia" : "Todos los controles al estándar"; }
  return { estado, razon, score, incidencias, pendingTotal, pendingCrit, criticalOpen, impFail, minorFail };
}

/* ============ RUTEO DE NOTIFICACIONES (simulado en piloto) ============ */
function notifyTarget(c) {
  if (c.type === "posiciones") return "Recursos Humanos + Gerente distrital";
  if (c.type === "temp") return "Mantenimiento + Gerente de turno";
  if (c.type === "canales" || c.type === "pos" || c.id === 27) return "Soporte de sistemas (Foodbot)";
  if (c.type === "stock" || c.type === "multicount") return "Jefe de producción + Gerente distrital";
  return "Gerente de turno";
}

/* ============ HISTORIAL Y RESUMEN ============ */
function sanitizeKey(s) { return (s || "sucursal").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sucursal"; }
function buildResumen(meta, today, g, entries, captured, total) {
  const icon = { verde: "🟢", amarillo: "🟡", rojo: "🔴" }[g.estado];
  const estado = { verde: "LISTO PARA ABRIR", amarillo: "APERTURA CON OBSERVACIONES", rojo: "NO LISTO PARA ABRIR" }[g.estado];
  let txt = `🏮 LINE CHECK · ${meta.sucursal || "Sucursal"} · ${today}\n${icon} ${estado} · Score ${g.score} · ${captured}/${total} capturados\n`;
  if (meta.firma) txt += `✍ Liberado por ${meta.firma.nombre} a las ${new Date(meta.firma.ts).toLocaleTimeString()}\n`;
  if (g.incidencias.length) {
    txt += `\nIncidencias (${g.incidencias.length}):\n`;
    for (const { c, r, alerta } of g.incidencias) {
      txt += `• ${c.name} [${CRIT_LABEL[c.crit]}${alerta ? ` · ${Math.round(r.pct * 100)}% del mínimo` : ""}]\n  Acción: ${entries[c.id]?.comment || "pendiente de registrar"}\n  Notificar: ${notifyTarget(c)}\n`;
    }
  } else {
    txt += "\nSin incidencias. Todos los controles al estándar. ✅\n";
  }
  return txt;
}

/* ============ FOTO: comprimir a miniatura ============ */
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 480 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.6));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

                    <span className="flex-1 text-stone-800" style={{ fontSize: 13 }}>{item}</span>
                    <input type="number" inputMode="numeric" value={raw ?? ""} onChange={(ev) => set({ counts: { ...(e.counts || {}), [item]: ev.target.value } })} placeholder="0"
                      className="w-16 border border-stone-300 rounded-lg px-2 py-1.5 font-bold text-center" style={{ fontSize: 14 }} />
                    <span className={`w-14 text-right font-bold ${pct == null ? "text-stone-300" : pct >= 100 ? "text-emerald-600" : pct >= 70 ? "text-amber-600" : "text-red-600"}`} style={{ fontSize: 12 }}>{pct == null ? "—" : pct + "%"}</span>
                  </div>
                );
              })}
            </div>
          )}

          {c.type === "pos" && (
            <div className="mt-2 space-y-2">
              <div className="flex gap-2">
                <button onClick={() => set({ ok: true })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === true ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>POS activo</button>
                <button onClick={() => set({ ok: false })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === false ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>Sin sistema</button>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-stone-500" style={{ fontSize: 13 }}>Fondo de caja $</span>
                <input type="number" inputMode="decimal" value={e.value ?? ""} onChange={(ev) => set({ value: ev.target.value })} placeholder="0" className="w-28 border border-stone-300 rounded-lg px-3 py-1.5 font-bold" />
              </div>
            </div>
          )}

          {c.type === "check" && (
            <div className="flex gap-2 mt-2">
              <button onClick={() => set({ ok: true })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === true ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>{c.okText || "Conforme"}</button>
              <button onClick={() => set({ ok: false })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === false ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>{c.failText || "No conforme"}</button>
            </div>
          )}

          {c.type === "checkfoto" && (
            <div className="mt-2">
              <div className="flex gap-2">
                <button onClick={() => set({ ok: true })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === true ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>Conforme</button>
                <button onClick={() => set({ ok: false })} className={`flex-1 py-2 rounded-lg font-bold border ${e.ok === false ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-600 border-stone-300"}`} style={{ fontSize: 13 }}>No conforme</button>
              </div>
              <PhotoInput e={e} set={set} label="Foto de la pulpa (obligatoria)" />
            </div>
          )}

          {c.type === "photo" && (
            <div>
              {c.naOption && !e.photo && (
                e.na
                  ? <p className="mt-2 text-stone-500 font-medium" style={{ fontSize: 13 }}>No aplica en esta sucursal · <button onClick={() => set({ na: false })} className="underline">reactivar</button></p>
                  : <button onClick={() => set({ na: true })} className="mt-1 text-stone-400 underline" style={{ fontSize: 12 }}>No aplica en esta sucursal</button>
              )}
              {!(c.naOption && e.na) && <PhotoInput e={e} set={set} />}
            </div>
          )}

          {c.type === "muestreo" && assignedItems[c.assigned] && (
            <div className="mt-2 space-y-1.5">
              <p className="text-orange-700 font-medium" style={{ fontSize: 12 }}>Asignación de hoy:</p>
              {assignedItems[c.assigned].map((item) => {
                const val = (e.items || {})[item];
                return (
                  <div key={item} className="flex items-center gap-2">
                    <span className="flex-1 text-stone-800" style={{ fontSize: 13 }}>{item}</span>
                    <button onClick={() => set({ items: { ...(e.items || {}), [item]: true } })} className={`px-2.5 py-1 rounded font-bold border ${val === true ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>{c.okLabel}</button>
                    <button onClick={() => set({ items: { ...(e.items || {}), [item]: false } })} className={`px-2.5 py-1 rounded font-bold border ${val === false ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>{c.failLabel}</button>
                  </div>
                );
              })}
            </div>
          )}

          {c.type === "canales" && (
            <div className="mt-2 space-y-1.5">
              {c.items.map((canal) => {
                const v = (e.items || {})[canal];
                const setCanal = (val) => set({ items: { ...(e.items || {}), [canal]: val } });
                return (
                  <div key={canal} className="flex items-center gap-1.5">
                    <span className="flex-1 text-stone-800 font-medium" style={{ fontSize: 13 }}>{canal}</span>
                    <button onClick={() => setCanal("ok")} className={`px-2 py-1 rounded font-bold border ${v === "ok" ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>En línea</button>
                    <button onClick={() => setCanal("fail")} className={`px-2 py-1 rounded font-bold border ${v === "fail" ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>Caído</button>
                    <button onClick={() => setCanal("na")} className={`px-2 py-1 rounded font-bold border ${v === "na" ? "bg-stone-500 text-white border-stone-500" : "bg-white text-stone-400 border-stone-300"}`} style={{ fontSize: 12 }}>N/A</button>
                  </div>
                );
              })}
            </div>
          )}

          {c.type === "posiciones" && (
            <div className="mt-2 space-y-1.5">
              {c.items.map((pos) => {
                const v = (e.pos || {})[pos];
                return (
                  <div key={pos} className="flex items-center gap-2">
                    <span className="flex-1 text-stone-800" style={{ fontSize: 13 }}>{pos}</span>
                    <button onClick={() => set({ pos: { ...(e.pos || {}), [pos]: true } })} className={`px-2.5 py-1 rounded font-bold border ${v === true ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>Presente</button>
                    <button onClick={() => set({ pos: { ...(e.pos || {}), [pos]: false } })} className={`px-2.5 py-1 rounded font-bold border ${v === false ? "bg-red-600 text-white border-red-600" : "bg-white text-stone-500 border-stone-300"}`} style={{ fontSize: 12 }}>Ausente</button>
                  </div>
                );
              })}
              <input value={e.extra ?? ""} onChange={(ev) => set({ extra: ev.target.value })} placeholder="Posición adicional presente (opcional)"
                className="w-full border border-stone-300 rounded-lg px-2.5 py-1.5 mt-1" style={{ fontSize: 13 }} />
            </div>
          )}

          {needsComment && (
            <div className="mt-2">
              <textarea value={e.comment ?? ""} onChange={(ev) => set({ comment: ev.target.value })} rows={2}
                placeholder="Obligatorio: describe el problema y la acción correctiva con hora límite…"
                className={`w-full border rounded-lg px-2.5 py-2 ${!e.comment ? "border-red-400 bg-red-50" : "border-stone-300"}`} style={{ fontSize: 13 }} />
              {!e.comment && <p className="text-red-600 font-medium" style={{ fontSize: 11 }}>La incidencia no puede quedar sin acción registrada.</p>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function LineCheckApp() {
  const today = new Date().toISOString().slice(0, 10);
  const storageKey = `linecheck:${today}`;
  const [entries, setEntries] = useState({});
  const [meta, setMeta] = useState({ sucursal: "", responsable: "", firma: null });
  const [tab, setTab] = useState("linea");
  const [loaded, setLoaded] = useState(false);
  const [hist, setHist] = useState(null);
  const [copied, setCopied] = useState(false);
  const [expanded, setExpanded] = useState(null);

  const assignedItems = useMemo(() => {
    const rng = mulberry32(hashStr(today));
    const sensorial = [
      "Salsa: " + pickN(POOL_SALSAS, 1, rng)[0],
      "Aderezo: " + pickN(POOL_ADEREZOS, 1, rng)[0],
      "Bebida: " + pickN(POOL_CONCENTRADOS, 1, rng)[0],
      ...pickN(POOL_VEGETALES, 3, rng).map((v) => "Vegetal: " + v),
      ...PROTEINAS.map((p) => "Proteína: " + p),
    ];
    return { sensorial, proteina: pickN(PROTEINAS, 1, rng) };
  }, [today]);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(storageKey);
        if (res?.value) { const d = JSON.parse(res.value); setEntries(d.entries || {}); setMeta(d.meta || { sucursal: "", responsable: "", firma: null }); }
      } catch { /* primer uso del día */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(storageKey, JSON.stringify({ entries, meta })); } catch (err) { console.error("No se pudo guardar", err); }
    }, 600);
    return () => clearTimeout(t);
  }, [entries, meta, loaded]);

  const update = (id, val) => setEntries((prev) => ({ ...prev, [id]: val }));
  const g = evalGlobal(entries);
  const sem = SEM[g.estado];

  const captured = CONTROLS.filter((c) => evalControl(c, entries[c.id]).status !== "pending").length;
  const commentsMissing = g.incidencias.some(({ c }) => !(entries[c.id]?.comment));
  const canSign = g.estado !== "rojo" && g.pendingTotal === 0 && !commentsMissing && meta.responsable.trim();

  const firmarLiberacion = async () => {
    const firma = { nombre: meta.responsable, ts: new Date().toISOString() };
    setMeta({ ...meta, firma });
    try {
      const key = `historial:${sanitizeKey(meta.sucursal)}:${today}`;
      const record = {
        sucursal: meta.sucursal || "Sucursal", fecha: today, firma, estado: g.estado, score: g.score,
        incidencias: g.incidencias.map(({ c, r, alerta }) => ({ name: c.name, crit: c.crit, alerta: !!alerta, pct: Math.round(r.pct * 100), comment: entries[c.id]?.comment || "", notifica: notifyTarget(c) })),
        fotos: CONTROLS.filter((c) => entries[c.id]?.photo).map((c) => ({ name: c.name, photo: entries[c.id].photo, ts: entries[c.id].ts })),
        resumen: buildResumen({ ...meta, firma }, today, g, entries, captured, CONTROLS.length),
      };
      await window.storage.set(key, JSON.stringify(record), true);
      // conservar solo los últimos 15 expedientes en este dispositivo
      const res = await window.storage.list("historial:", true);
      const keys = (res?.keys || []).sort();
      while (keys.length > 15) { const old = keys.shift(); try { await window.storage.delete(old, true); } catch {} }
    } catch (err) { console.error("No se pudo guardar en historial", err); }
  };

  const copiarResumen = async () => {
    const txt = buildResumen(meta, today, g, entries, captured, CONTROLS.length);
    try { await navigator.clipboard.writeText(txt); setCopied(true); setTimeout(() => setCopied(false), 2500); }
    catch { window.prompt("Copia el resumen:", txt); }
  };

  const loadHist = async () => {
    try {
      const res = await window.storage.list("historial:", true);
      const keys = (res?.keys || []).slice(-10).reverse();
      const out = [];
      for (const k of keys) {
        try { const r = await window.storage.get(typeof k === "string" ? k : k.key, true); if (r?.value) out.push(JSON.parse(r.value)); } catch {}
      }
      out.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
      setHist(out);
    } catch { setHist([]); }
  };
  useEffect(() => { if (tab === "historial") { setHist(null); loadHist(); } }, [tab]);

  const modControls = (mod) => {
    const blocks = [...new Set(CONTROLS.filter((c) => c.mod === mod).map((c) => c.block))];
    return blocks.map((b) => (
      <div key={b}>
        <p className="uppercase font-bold text-stone-400 mt-4 mb-2" style={{ fontSize: 11, letterSpacing: "0.14em" }}>{b}</p>
        {CONTROLS.filter((c) => c.mod === mod && c.block === b).map((c) => (
          <ControlCard key={c.id} c={c} entry={entries[c.id]} update={update} assignedItems={assignedItems} />
        ))}
      </div>
    ));
  };

  return (
    <div className="min-h-screen bg-stone-100 pb-32" style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div className="bg-stone-950 text-white px-4 pt-5 pb-4">
        <div className="flex items-baseline justify-between">
          <h1 className="font-black tracking-tight" style={{ fontSize: 22 }}>ROCK N&rsquo;WOK</h1>
          <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }} className="text-orange-400">{today}</span>
        </div>
        <p className="uppercase text-stone-400 mt-0.5" style={{ fontSize: 11, letterSpacing: "0.2em" }}>Line Check · Validación de apertura · v1.1</p>
        <div className="flex gap-2 mt-3">
          <input value={meta.sucursal} onChange={(e) => setMeta({ ...meta, sucursal: e.target.value })} placeholder="Sucursal" className="flex-1 bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-white placeholder-stone-500" style={{ fontSize: 13 }} />
          <input value={meta.responsable} onChange={(e) => setMeta({ ...meta, responsable: e.target.value })} placeholder="Responsable" className="flex-1 bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-white placeholder-stone-500" style={{ fontSize: 13 }} />
        </div>
      </div>

      <div className="flex bg-white border-b border-stone-200 sticky top-0 z-10">
        {[["linea", "Línea"], ["front", "Front"], ["resumen", "Liberación"], ["historial", "Historial"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} className={`flex-1 py-3 font-bold ${tab === k ? "text-orange-600 border-b-2 border-orange-600" : "text-stone-500"}`} style={{ fontSize: 13 }}>{label}</button>
        ))}
      </div>

      <div className="px-3 max-w-lg mx-auto">
        {tab === "linea" && modControls("linea")}
        {tab === "front" && modControls("front")}

        {tab === "historial" && (
          <div className="mt-4">
            <p className="text-stone-500 bg-white rounded-xl p-3 border border-stone-200 mb-3" style={{ fontSize: 12 }}>
              Antecedente de aperturas firmadas en este dispositivo (versión piloto — en producción vive en la base de datos central).
            </p>
            {hist === null && <p className="text-stone-400 text-center py-6" style={{ fontSize: 13 }}>Cargando historial…</p>}
            {hist !== null && hist.length === 0 && <p className="text-stone-400 text-center py-6" style={{ fontSize: 13 }}>Aún no hay aperturas firmadas. La primera liberación creará el primer expediente.</p>}
            {hist !== null && hist.map((h, i) => {
              const s = SEM[h.estado] || SEM.rojo;
              const open = expanded === i;
              return (
                <div key={i} className="bg-white rounded-xl border border-stone-200 mb-2 overflow-hidden">
                  <button onClick={() => setExpanded(open ? null : i)} className="w-full text-left p-3">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <p className="font-bold text-stone-900" style={{ fontSize: 14 }}>{h.sucursal}</p>
                        <p className="text-stone-500" style={{ fontFamily: "ui-monospace, monospace", fontSize: 11 }}>{h.fecha} · {h.firma?.nombre} · {h.firma ? new Date(h.firma.ts).toLocaleTimeString() : ""}</p>
                      </div>
                      <div className="text-right">
                        <span className={`${s.bg} text-white font-bold px-2 py-1 rounded`} style={{ fontSize: 11 }}>{s.icon} {h.score}</span>
                        <p className="text-stone-400 mt-1" style={{ fontSize: 11 }}>{(h.incidencias || []).length} incidencia(s) · {(h.fotos || []).length} foto(s)</p>
                      </div>
                    </div>
                  </button>
                  {open && (
                    <div className="px-3 pb-3 border-t border-stone-100">
                      {(h.incidencias || []).map((inc, j) => (
                        <div key={j} className="mt-2">
                          <p className="font-semibold text-stone-800" style={{ fontSize: 13 }}>{inc.name} <span className={`ml-1 px-1.5 py-0.5 rounded font-bold ${CRIT_STYLE[inc.crit]}`} style={{ fontSize: 10 }}>{CRIT_LABEL[inc.crit]}</span></p>
                          <p className="text-stone-600" style={{ fontSize: 12 }}>{inc.alerta ? `Alerta · ${inc.pct}% del mínimo` : "Falla"} · {inc.comment || "sin acción registrada"} · 🔔 {inc.notifica}</p>
                        </div>
                      ))}
                      {(h.incidencias || []).length === 0 && <p className="text-emerald-700 font-medium mt-2" style={{ fontSize: 12 }}>Sin incidencias — apertura limpia.</p>}
                      {(h.fotos || []).length > 0 && (
                        <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
                          {h.fotos.map((f, j) => (
                            <div key={j} className="shrink-0">
                              <img src={f.photo} alt={f.name} className="w-24 h-24 object-cover rounded-lg border border-stone-200" />
                              <p className="text-stone-400 w-24 truncate" style={{ fontSize: 10 }}>{f.name}</p>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab === "resumen" && (
          <div className="mt-4">
            <div className={`${sem.bg} text-white rounded-2xl p-5 text-center`}>
              <p className="font-black" style={{ fontSize: 26 }}>{sem.icon} {sem.text}</p>
              <p className="opacity-90 mt-1" style={{ fontSize: 13 }}>{g.razon}</p>
              <div className="flex justify-center gap-6 mt-3" style={{ fontFamily: "ui-monospace, monospace", fontSize: 13 }}>
                <span>Score {g.score}</span>
                <span>{captured}/{CONTROLS.length} capturados</span>
              </div>
            </div>

            {g.criticalOpen.length > 0 && (
              <div className="bg-white border border-red-300 rounded-xl p-3 mt-3">
                <p className="font-bold text-red-700" style={{ fontSize: 13 }}>Gates críticos abiertos — bloquean la apertura:</p>
                {g.criticalOpen.map((c) => <p key={c.id} className="text-stone-800 mt-1" style={{ fontSize: 13 }}>■ {c.name}</p>)}
              </div>
            )}
            {g.pendingCrit > 0 && (
              <div className="bg-white border border-red-300 rounded-xl p-3 mt-3">
                <p className="font-bold text-red-700" style={{ fontSize: 13 }}>{g.pendingCrit} control(es) crítico(s) sin capturar. El sistema no libera con evidencia crítica faltante.</p>
              </div>
            )}

            <p className="uppercase font-bold text-stone-400 mt-5 mb-2" style={{ fontSize: 11, letterSpacing: "0.14em" }}>Incidencias generadas ({g.incidencias.length})</p>
            {g.incidencias.length === 0 && <p className="text-stone-500 bg-white rounded-xl p-3 border border-stone-200" style={{ fontSize: 13 }}>Sin incidencias. Todos los controles capturados están al estándar.</p>}
            {g.incidencias.map(({ c, r, alerta }) => (
              <div key={c.id + (alerta ? "a" : "f")} className="bg-white rounded-xl border border-stone-200 p-3 mb-2">
                <div className="flex items-center justify-between gap-2">
                  <p className="font-semibold text-stone-900" style={{ fontSize: 13 }}>{c.name}</p>
                  <Badge crit={c.crit} />
                </div>
                <p className={`font-bold mt-0.5 ${alerta ? "text-amber-600" : "text-red-600"}`} style={{ fontSize: 12 }}>
                  {alerta ? `ALERTA · ${Math.round(r.pct * 100)}% del mínimo` : "FALLA"}
                  {c.crit === "C" && !alerta ? " · Hora límite: antes de apertura" : c.crit === "I" ? " · Hora límite: ≤ 2 hrs" : ""}
                </p>
                <p className="text-stone-600 mt-1" style={{ fontSize: 12 }}>{entries[c.id]?.comment || "⚠ Falta registrar acción correctiva"}</p>
                <p className="text-orange-700 font-medium mt-1" style={{ fontSize: 12 }}>🔔 Notifica a: {notifyTarget(c)} <span className="text-stone-400">(automático en producción · manual en piloto)</span></p>
              </div>
            ))}

            <div className="bg-white rounded-xl border border-stone-200 p-4 mt-5">
              {meta.firma ? (
                <div className="text-center">
                  <p className="font-black text-emerald-700" style={{ fontSize: 15 }}>APERTURA LIBERADA</p>
                  <p style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }} className="text-stone-500 mt-1">{meta.firma.nombre} · {new Date(meta.firma.ts).toLocaleString()}</p>
                  <button onClick={copiarResumen} className="w-full mt-3 py-2.5 rounded-xl font-bold bg-emerald-600 text-white" style={{ fontSize: 14 }}>
                    {copied ? "✓ Copiado — pégalo en el grupo" : "📲 Copiar resumen para WhatsApp"}
                  </button>
                  <p className="text-stone-400 mt-2" style={{ fontSize: 11 }}>Guardado en el historial de este dispositivo.</p>
                </div>
              ) : (
                <React.Fragment>
                  <button disabled={!canSign} onClick={firmarLiberacion}
                    className={`w-full py-3 rounded-xl font-black ${canSign ? "bg-stone-950 text-white" : "bg-stone-200 text-stone-400"}`} style={{ fontSize: 15 }}>
                    Firmar liberación de apertura
                  </button>
                  {!canSign && (
                    <p className="text-stone-500 text-center mt-2" style={{ fontSize: 12 }}>
                      {g.estado === "rojo" ? "No se puede liberar en rojo." : g.pendingTotal > 0 ? `Faltan ${g.pendingTotal} controles por capturar.` : commentsMissing ? "Hay incidencias sin acción registrada." : "Escribe el nombre del responsable en el encabezado."}
                    </p>
                  )}
                </React.Fragment>
              )}
            </div>

            <button onClick={() => { setEntries({}); setMeta({ ...meta, firma: null }); }} className="w-full text-stone-400 underline mt-4 mb-2" style={{ fontSize: 12 }}>Reiniciar Line Check del día</button>
          </div>
        )}
      </div>

      {tab !== "resumen" && tab !== "historial" && (
        <div className={`fixed bottom-0 left-0 right-0 ${sem.bg} text-white px-4 py-3 flex items-center justify-between shadow-lg`}>
          <div>
            <p className="font-black leading-tight" style={{ fontSize: 14 }}>{sem.icon} {sem.text}</p>
            <p className="opacity-90" style={{ fontSize: 11 }}>{g.razon}</p>
          </div>
          <div className="text-right" style={{ fontFamily: "ui-monospace, monospace" }}>
            <p className="font-bold" style={{ fontSize: 16 }}>{g.score}</p>
            <p style={{ fontSize: 11 }} className="opacity-90">{captured}/{CONTROLS.length}</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LineCheckApp />);
</script>
</body>
</html>
